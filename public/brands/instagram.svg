<!-- Instagram's glyph, drawn from its published geometry: rounded square,
     circle, dot, over the brand gradient. Replace with an official asset if you
     have licensed one; the filename is all this app depends on. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24" role="img" aria-label="Instagram">
  <defs>
    <linearGradient id="ig" x1="2" y1="22" x2="22" y2="2" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FFD521"/><stop offset=".25" stop-color="#F50000"/>
      <stop offset=".6" stop-color="#B900B4"/><stop offset="1" stop-color="#4D00C0"/>
    </linearGradient>
  </defs>
  <rect width="24" height="24" rx="6" fill="url(#ig)"/>
  <rect x="5.4" y="5.4" width="13.2" height="13.2" rx="4.2" fill="none" stroke="#fff" stroke-width="1.7"/>
  <circle cx="12" cy="12" r="3.3" fill="none" stroke="#fff" stroke-width="1.7"/>
  <circle cx="16.4" cy="7.6" r="1.05" fill="#fff"/>
</svg>
