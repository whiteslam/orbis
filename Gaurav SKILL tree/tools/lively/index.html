<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Gaurav's skill tree</title>
<style>
  html, body { height: 100%; margin: 0; overflow: hidden; background: #2A2A68 linear-gradient(#12163F, #2A2A68 45%, #6A4688 75%, #C96F86) center / cover no-repeat; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; opacity: 0; transition: opacity .4s; }
  iframe.ready { opacity: 1; }
</style>
</head>
<body>
<script>
  // This tiny page stays open. The tree lives inside it, and is unloaded completely while another
  // app is in use, which hands its memory back to Windows. A still snapshot shows in its place, and
  // the live tree returns when the desktop does.
  const TREE = 'http://localhost:3000/?wallpaper=1';
  const UNLOAD_AFTER = 5000;
  let frame = null, paused = false, unloadTimer = null, retryTimer = null;

  function load() {
    clearTimeout(retryTimer);
    if (frame || paused) return;
    fetch('http://localhost:3000/status.json', { mode: 'no-cors', cache: 'no-store' }).then(() => {
      if (frame || paused) return;
      frame = document.createElement('iframe');
      frame.title = "Gaurav's skill tree";
      frame.onload = () => { if (frame) frame.classList.add('ready'); };
      frame.src = TREE;
      document.body.appendChild(frame);
    }).catch(() => {
      // At login the tree's server can start after this page, so keep trying until it answers.
      retryTimer = setTimeout(load, 2000);
    });
  }

  function showSnapshot() {
    const picture = new Image();
    const address = 'http://localhost:3000/wallpaper.png?' + Date.now();
    picture.onload = () => { document.body.style.backgroundImage = 'url("' + address + '")'; };
    picture.src = address;
  }

  function unload() {
    if (!frame) return;
    frame.src = 'about:blank';
    frame.remove();
    frame = null;
  }

  // Lively calls this whenever the wallpaper is covered or uncovered.
  window.livelyWallpaperPlaybackChanged = (data) => {
    let isPaused = false;
    try { isPaused = JSON.parse(data).IsPaused === true; } catch { isPaused = false; }
    paused = isPaused;
    clearTimeout(unloadTimer);
    if (paused) { showSnapshot(); unloadTimer = setTimeout(unload, UNLOAD_AFTER); }
    else load();
  };

  showSnapshot();
  load();
</script>
</body>
</html>
