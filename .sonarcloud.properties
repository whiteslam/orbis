# SonarCloud automatic analysis settings.
#
# supabase/ holds Postgres SQL, which Sonar reads with its Oracle PL/SQL
# analyzer. The migrations are applied history and must not be rewritten, and
# pending.sql is a generated bundle of those same migrations, so both are left
# out of analysis and duplication checks.
sonar.exclusions=supabase/**/*.sql
sonar.cpd.exclusions=supabase/**/*.sql
